<!DOCTYPE html>

<head>

<body>
    <div class="all">
        <h1>LifeList</h1>
        <p class="sub">Your personal tracker — create, edit, save.</p>
        <div class="container1">
            <h2 class="h2_1">Add Item</h2>
            <form class="con1">
                <label for="titlep">Title</label>
                <input type="text" id="titlep" placeholder="e.g. Go train" required>
                <label for="select">categorey</label>
                <select name="select" id="select">
                    <option value="Train">Train</option>
                    <option value="Work">Work</option>
                    <option value="Cook">Cook</option>
                    <option value="Drink">Drink</option>
                </select>
                <label for="notes">notes</label>
                <textarea name="notes" id="notes" placeholder="Optional details..."></textarea>
                <div class="btns">
                    <button type="submit" class="btn1">Add item</button>
                    <button type="button" class="cancel">cancel</button>
                </div>
            </form>

        </div>
        <div class="container2">
            <div class="ganmb">
                <h2>My items <span class="items-count">0</span></h2>
                <button class="btn2">clear all</button>
            </div>
            <p class="pp">add items man !!</p>
            <div class="things">

            </div>
        </div>
